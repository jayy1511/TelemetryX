[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"


[project]
name = "telemetryx"
version = "0.1.0"
description = "Lap-by-lap Formula 1 race winner probability prediction."
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastf1>=3.8,<4.0",
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<4.0",
    "pyarrow>=17,<24",
    "PyYAML>=6.0,<7.0",
    "scikit-learn>=1.5,<2.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.9,<1.0",
    "mypy>=1.14,<2.0",
    "pandas-stubs>=2.2,<3.0",
    "types-PyYAML>=6.0,<7.0",
]

ml = [
    "scikit-learn>=1.6,<2.0",
    "catboost>=1.2,<2.0",
    "joblib>=1.4,<2.0",
]

app = [
    "streamlit>=1.40,<2.0",
    "plotly>=5.24,<7.0",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]


[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]
ignore = []


[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "fastf1",
    "fastf1.*",
]
ignore_missing_imports = true